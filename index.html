<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Brand Logo</title>
    <style>
      body {
        margin: 2rem;
        font-family: system-ui, sans-serif;
        line-height: 1.5;
      }
      section {
        margin-bottom: 2.5rem;
      }
      img {
        max-width: min(100%, 480px);
        height: auto;
        display: block;
      }
    </style>
  </head>
  <body>
    <h1>Brand Logos</h1>

    <section>
      <h2>Default</h2>
      <p>
        <a href="logo.png">Direct link to logo.png</a>
      </p>
      <img src="logo.png" alt="Brand logo" />
    </section>

    <section>
      <h2>Transparent</h2>
      <p>
        <a href="cfa_transparent.png">Direct link to cfa_transparent.png</a>
      </p>
      <img src="cfa_transparent.png" alt="Brand logo with transparent background" />
    </section>
  </body>
</html>
